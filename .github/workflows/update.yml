name: Update offers
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 filter.py
      - run: |
          git config user.name "quant101-bot"
          git config user.email "quant101-bot@users.noreply.github.com"
          git add offers.json
          git diff --cached --quiet || git commit -m "Update offers"
          git push
